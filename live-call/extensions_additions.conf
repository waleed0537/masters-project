; ============================================================
; extensions.conf additions — the detection line (dial 600)
; Append this to /etc/asterisk/extensions.conf
; (back the original up first: sudo cp /etc/asterisk/extensions.conf /etc/asterisk/extensions.conf.bak)
;
; What it does when you dial 600:
;   1. Answers the call
;   2. Starts recording the caller's audio to /tmp/live.wav16
;      (wav16 = 16 kHz WAV, matching the model's sample rate)
;   3. Waits silently for up to 10 minutes while you speak
;      (Asterisk sends nothing back, so the recording contains
;       ONLY the caller's voice)
; ============================================================

[from-internal]
exten => 600,1,Answer()
 same => n,MixMonitor(/tmp/live.wav16)
 same => n,Wait(600)
 same => n,Hangup()
