; ============================================================
; pjsip.conf additions — one softphone extension (100)
; Append this to /etc/asterisk/pjsip.conf
; (back the original up first: sudo cp /etc/asterisk/pjsip.conf /etc/asterisk/pjsip.conf.bak)
; ============================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[100]
type=endpoint
context=from-internal
disallow=all
allow=g722,ulaw,alaw     ; g722 first = 16 kHz wideband audio when the softphone supports it
auth=auth100
aors=100

[auth100]
type=auth
auth_type=userpass
username=100
password=CHANGE_ME       ; choose your own — must match the softphone account

[100]
type=aor
max_contacts=2
